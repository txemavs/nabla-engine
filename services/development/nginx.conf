server {
    listen 80;
    server_name localhost;
    client_max_body_size 1m;
    location /prepared/ {
        alias /srv/prepared/;
        add_header Cache-Control "no-cache";
    }
    location /prepare/ {
        # Reject browser requests initiated by another site. This gateway is local only.
        if ($http_sec_fetch_site = cross-site) { return 403; }
        include /run/nabla/development-session.conf;
        proxy_pass http://world-cache:8080;
        proxy_read_timeout 130s;
    }
    location /world-cache/ {
        proxy_pass http://world-cache:8080/;
        proxy_read_timeout 130s;
    }
    location / {
        proxy_pass http://studio:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
