services:
  world-cache:
    build: .
    user: '${CACHE_UID:-1000}:${CACHE_GID:-1000}'
    restart: unless-stopped
    ports:
      - '127.0.0.1:8787:8080'
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CACHE_MAX_BYTES: '10737418240'
      CACHE_TTL_SECONDS: '2592000'
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
