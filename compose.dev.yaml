name: nabla-development
include:
  - compose.planet.yaml
services:
  setup:
    image: python:3.12-alpine
    volumes:
      - dependencies:/dependencies
      - npm-cache:/npm-cache
      - ./services/development/init.py:/init.py:ro
    environment:
      DEV_UID: '${NABLA_DEV_UID:-1000}'
      DEV_GID: '${NABLA_DEV_GID:-1000}'
    command: [python3, /init.py]
  game:
    image: node:22-alpine
    working_dir: /workspace
    user: '${NABLA_DEV_UID:-1000}:${NABLA_DEV_GID:-1000}'
    depends_on:
      setup:
        condition: service_completed_successfully
    command: [sh, -c, 'npm ci --ignore-scripts && npm run build && npm run dev -- --host 0.0.0.0']
    environment:
      npm_config_cache: /npm-cache
      VITE_WORLD_PREPARE_API: /prepare
      VITE_WORLD_PREPARED_URL: /prepared
      VITE_WORLD_ELEVATION_URL: /world-cache/elevation
    volumes:
      - .:/workspace
      - dependencies:/workspace/node_modules
      - npm-cache:/npm-cache
  web:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:${NABLA_DEV_PORT:-8080}:80']
    depends_on:
      world-cache:
        condition: service_healthy
      game:
        condition: service_started
    volumes:
      - ./services/development/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - secrets:/run/nabla:ro
volumes:
  dependencies:
  npm-cache:
