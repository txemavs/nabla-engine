name: nabla-development
services:
  setup:
    image: python:3.12-alpine
    volumes:
      - cache:/data
      - prepared:/publish
      - secrets:/secrets
      - dependencies:/dependencies
      - npm-cache:/npm-cache
      - ./services/development/init.py:/init.py:ro
    environment:
      DEV_UID: '${NABLA_DEV_UID:-1000}'
      DEV_GID: '${NABLA_DEV_GID:-1000}'
    command: [python3, /init.py]
  world-cache:
    build:
      context: .
      dockerfile: services/world-cache/Dockerfile.prepare
    depends_on:
      setup:
        condition: service_completed_successfully
    command:
      [sh, -c, 'export PREPARE_TOKEN="$$(cat /secrets/prepare-token)"; exec python3 -u server.py']
    environment:
      CACHE_MAX_BYTES: '5368709120'
      PREPARE_MAX_BYTES: '5368709120'
      PREPARE_ROOT: /publish
    volumes:
      - cache:/data
      - prepared:/publish
      - secrets:/secrets:ro
      - ./services/development/status.py:/app/dev-status.py:ro
    read_only: true
    tmpfs: ['/tmp:size=128m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 1
    healthcheck:
      test:
        [
          CMD,
          python3,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
  studio:
    image: node:22-alpine
    working_dir: /workspace
    user: '${NABLA_DEV_UID:-1000}:${NABLA_DEV_GID:-1000}'
    depends_on:
      setup:
        condition: service_completed_successfully
    command: [sh, -c, 'npm ci --ignore-scripts && npm run dev -- --host 0.0.0.0']
    environment:
      npm_config_cache: /npm-cache
      VITE_WORLD_PREPARE_API: /prepare
      VITE_WORLD_PREPARED_URL: /prepared
      VITE_WORLD_ELEVATION_URL: /world-cache/elevation
    volumes:
      - .:/workspace
      - dependencies:/workspace/node_modules
      - npm-cache:/npm-cache
  web:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:${NABLA_DEV_PORT:-8080}:80']
    depends_on:
      world-cache:
        condition: service_healthy
      studio:
        condition: service_started
    volumes:
      - ./services/development/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - prepared:/srv/prepared:ro
      - secrets:/run/nabla:ro
volumes:
  cache:
  prepared:
  secrets:
  dependencies:
  npm-cache:
