<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Cuadro S3 independiente</title>
    <style>
      body {
        margin: 24px;
        background: #101820;
        color: #eee;
        font: 17px system-ui;
      }
      canvas {
        display: block;
        max-width: 100%;
        height: auto;
      }
      label {
        display: inline-flex;
        gap: 12px;
        margin: 12px;
      }
      a {
        color: #8cd9ff;
      }
    </style>
  </head>
  <body>
    <h1>El mismo cuadro del S3, fuera del coche</h1>
    <p>
      Fondo y agujas del coche. Este ejemplo no carga vehículos ni física. Flechas y Enter: menú;
      Escape: volver.
    </p>
    <label>Velocidad <input id="speed" type="range" min="0" max="320" value="80" /></label>
    <label>RPM <input id="rpm" type="range" min="900" max="8000" value="3200" /></label>
    <p id="status" aria-live="polite"></p>
    <script type="module" src="./s3-monitor.ts"></script>
  </body>
</html>
