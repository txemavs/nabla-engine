# Atlas overrides for "el mundo" (nabla-engine dev stack). Use together with compose.dev.yaml:
#   docker compose -f compose.dev.yaml -f compose.atlas.yaml up -d
# - web is published on localhost AND on the Tailscale address 100.100.10.1:8080 (not on the LAN). Note: the web gateway
#   adds the local development session to /prepare requests, so anybody on the tailnet can queue GLB preparations.
# - world-cache queries the Overpass of nabla-ways running on Atlas (host port 8768, reached through host-gateway),
#   with no fallback to the public servers (OVERPASS_FALLBACK=0)
# - world-cache port 8787 stays on 127.0.0.1 (internal use; the web proxy reaches it by service name)
services:
  web:
    ports: !override
      - '127.0.0.1:${NABLA_DEV_PORT:-8080}:80'
      - '100.100.10.1:${NABLA_DEV_PORT:-8080}:80'
  world-cache:
    environment:
      OVERPASS_URL: http://host.docker.internal:8768/api/interpreter
      OVERPASS_FALLBACK: '0'
    extra_hosts: !override
      - 'host.docker.internal:host-gateway'
