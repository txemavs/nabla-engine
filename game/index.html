<!doctype html>
<html lang="en" class="nabla-game nabla-game--dashboard">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nabla Engine · Drive</title>
    <link rel="icon" type="image/svg+xml" href="/brand/source.svg" />
    <!-- Critical CSS: nothing unstyled (or the error overlay) shows before ui-styles.ts runs. -->
    <style id="nabla-critical">
      html { background: #121212; color-scheme: dark; }
      html:not(.nabla-styles-ready) body { visibility: hidden; }
      #error-message:not(.visible) { display: none; }
    </style>
    <script type="module" src="./ui-styles.ts"></script>
  </head>
  <body>
    <div id="loading-screen">
      <img
        id="loading-logo"
        alt="Nabla"
        src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22180%22%20height%3D%22180%22%20viewBox%3D%220%200%20180%20180%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22a%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%23D9F5FF%22%2F%3E%3Cstop%20offset%3D%22.382%22%20stop-color%3D%22%2381B5D8%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23245580%22%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%22b%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%23244F7B%22%2F%3E%3Cstop%20offset%3D%22.618%22%20stop-color%3D%22%23609BBF%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23DFFAFF%22%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%22c%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%23ECFCFF%22%2F%3E%3Cstop%20offset%3D%22.382%22%20stop-color%3D%22%236498BA%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23C7EDF4%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Cpolygon%20fill%3D%22%23E8FAFF%22%20points%3D%2218%2C48.43%20162%2C48.43%20157.68%2C50.92%2022.32%2C50.92%22%2F%3E%3Cpolygon%20fill%3D%22%23719AB8%22%20points%3D%22162%2C48.43%2090%2C173.14%2090%2C168.15%20157.68%2C50.92%22%2F%3E%3Cpolygon%20fill%3D%22%23C6E9F8%22%20points%3D%2290%2C173.14%2018%2C48.43%2022.32%2C50.92%2090%2C168.15%22%2F%3E%3Cpolygon%20fill%3D%22url(%23a)%22%20points%3D%2222.32%2C50.92%20157.68%2C50.92%20141.84%2C60.07%2038.16%2C60.07%22%2F%3E%3Cpolygon%20fill%3D%22url(%23b)%22%20points%3D%22157.68%2C50.92%2090%2C168.15%2090%2C149.86%20141.84%2C60.07%22%2F%3E%3Cpolygon%20fill%3D%22url(%23c)%22%20points%3D%2290%2C168.15%2022.32%2C50.92%2038.16%2C60.07%2090%2C149.86%22%2F%3E%3Cpolygon%20fill%3D%22%23274D70%22%20points%3D%2238.16%2C60.07%20141.84%2C60.07%20137.52%2C62.56%2042.48%2C62.56%22%2F%3E%3Cpolygon%20fill%3D%22%23D2EDF4%22%20points%3D%22141.84%2C60.07%2090%2C149.86%2090%2C144.87%20137.52%2C62.56%22%2F%3E%3Cpolygon%20fill%3D%22%2384B5D2%22%20points%3D%2290%2C149.86%2038.16%2C60.07%2042.48%2C62.56%2090%2C144.87%22%2F%3E%3C%2Fsvg%3E"
      />
      <h1 id="loading-title" hidden></h1>
      <div id="loading-status">Cargando el motor…</div>
      <div id="loading-progress">
        <div id="loading-progress-bar"></div>
      </div>
    </div>
    <script>
      // A host's mark-only / quiet splash (window.NABLA_BOOT set in <head>) from the first paint.
      ;(function () {
        const boot = window.NABLA_BOOT || {}
        const splash = boot.splash || {}
        const screen = document.getElementById('loading-screen')
        if (boot.preAttract || splash.layout === 'mark') {
          screen.classList.add('splash-mark', 'splash-no-status')
          const logo = document.getElementById('loading-logo')
          logo.src = splash.logoUrl || '/brand/source.svg'
          logo.hidden = false
        } else if (splash.status === false) screen.classList.add('splash-no-status')
      })()
    </script>

    <div id="game-container">
      <canvas id="game-canvas"></canvas>
    </div>

    <div id="game-hud" class="hidden">
      <div id="speed-display">0 km/h</div>
      <div id="gear-display">N</div>
      <div id="location-display"></div>
      <div id="game-message" role="status"></div>
    </div>

    <details id="display-settings">
      <summary>Menú</summary>
      <fieldset class="menu-section" id="display-quality-section">
        <legend>Calidad</legend>
        <label
          >Perfil
          <select id="display-quality">
            <option value="custom">Predeterminada</option>
            <option value="minimal">Mínima</option>
            <option value="mobile">Móvil</option>
            <option value="low">Baja</option>
            <option value="balanced">Equilibrada</option>
            <option value="high">Alta</option>
            <option value="ultra">Ultra</option>
          </select>
        </label>
        <button id="display-apply-quality" type="button">Aplicar calidad y reiniciar demo</button>
        <p>Sincronización: automática del navegador.</p>
      </fieldset>
      <fieldset class="menu-section" id="display-performance">
        <legend>Rendimiento</legend>
        <label
          >Límite de FPS (0 = automático)
          <input id="display-fps" type="number" min="0" max="360" step="1" value="0" />
        </label>
        <label
          >Escala de resolución <span id="display-scale-label">80% del perfil</span>
          <input id="display-scale" type="range" min="25" max="200" step="5" value="80" />
        </label>
        <label class="inline"
          ><input id="display-scale-auto" type="checkbox" /> Escala automática (50–100%)</label
        >
        <p>FPS y escala se aplican durante la partida.</p>
      </fieldset>
      <div id="menu-sections"></div>
    </details>

    <div id="controls-hint" aria-live="off"></div>

    <div id="error-message">
      <h2>Error</h2>
      <p id="error-text">Ha ocurrido un error</p>
      <button onclick="location.reload()">Recargar</button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
