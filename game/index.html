<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nabla Engine · Drive</title>
    <link rel="icon" type="image/svg+xml" href="/brand/source.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a1a;
        color: #eee;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        z-index: 1000;
        transition: opacity 0.5s ease-out;
      }
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading-screen h1 {
        font-size: 2rem;
        font-weight: 300;
        letter-spacing: 0.1em;
      }
      #loading-status {
        font-size: 1rem;
        color: #888;
      }
      #loading-progress {
        width: 300px;
        height: 4px;
        background: #333;
        border-radius: 2px;
        overflow: hidden;
      }
      #loading-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #4a9eff, #7c3aed);
        width: 0%;
        transition: width 0.3s ease-out;
      }
      #loading-tiles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        margin-top: 16px;
      }
      .tile-indicator {
        width: 24px;
        height: 24px;
        background: #333;
        border-radius: 4px;
        transition: background 0.3s;
      }
      .tile-indicator.loaded {
        background: #4a9eff;
      }
      .tile-indicator.center {
        background: #7c3aed;
      }
      #game-container {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #game-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #game-hud {
        position: fixed;
        bottom: 20px;
        left: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.6);
        padding: 16px;
        border-radius: 8px;
        pointer-events: none;
      }
      #game-hud.hidden {
        display: none;
      }
      #speed-display {
        font-size: 2rem;
        font-weight: 600;
      }
      #controls-hint {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.6);
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 12px;
        color: #888;
      }
      #controls-hint kbd {
        display: inline-block;
        padding: 2px 6px;
        background: #333;
        border-radius: 4px;
        margin: 0 2px;
      }
      #error-message {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(0, 0, 0, 0.9);
        z-index: 2000;
      }
      #error-message.visible {
        display: flex;
      }
      #error-message h2 {
        color: #ff4444;
      }
      #error-message button {
        padding: 12px 24px;
        background: #333;
        border: none;
        color: #eee;
        border-radius: 6px;
        cursor: pointer;
      }
      #error-message button:hover {
        background: #444;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <h1>NABLA ENGINE</h1>
      <div id="loading-status">Initializing...</div>
      <div id="loading-progress">
        <div id="loading-progress-bar"></div>
      </div>
      <div id="loading-tiles">
        <div class="tile-indicator" data-tile="0"></div>
        <div class="tile-indicator" data-tile="1"></div>
        <div class="tile-indicator" data-tile="2"></div>
        <div class="tile-indicator" data-tile="3"></div>
        <div class="tile-indicator center" data-tile="4"></div>
        <div class="tile-indicator" data-tile="5"></div>
        <div class="tile-indicator" data-tile="6"></div>
        <div class="tile-indicator" data-tile="7"></div>
        <div class="tile-indicator" data-tile="8"></div>
      </div>
    </div>

    <div id="game-container">
      <canvas id="game-canvas"></canvas>
    </div>

    <div id="game-hud" class="hidden">
      <div id="speed-display">0 km/h</div>
      <div id="gear-display">N</div>
      <div id="location-display"></div>
    </div>

    <div id="controls-hint">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Drive · <kbd>Space</kbd> Brake ·
      <kbd>C</kbd> Camera · <kbd>R</kbd> Reset
    </div>

    <div id="error-message">
      <h2>Error</h2>
      <p id="error-text">Something went wrong</p>
      <button onclick="location.reload()">Reload</button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
