<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nabla Engine · Drive</title>
    <link rel="icon" type="image/svg+xml" href="/brand/source.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a1a;
        color: #eee;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        z-index: 1000;
        transition: opacity 0.5s ease-out;
      }
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #loading-screen h1 {
        font-size: 2rem;
        font-weight: 300;
        letter-spacing: 0.1em;
      }
      #loading-status {
        font-size: 1rem;
        color: #888;
      }
      #loading-progress {
        width: 300px;
        height: 4px;
        background: #333;
        border-radius: 2px;
        overflow: hidden;
      }
      #loading-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #4a9eff, #7c3aed);
        width: 0%;
        transition: width 0.3s ease-out;
      }
      #loading-tiles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        margin-top: 16px;
      }
      .tile-indicator {
        width: 24px;
        height: 24px;
        background: #333;
        border-radius: 4px;
        transition: background 0.3s;
      }
      .tile-indicator.loaded {
        background: #4a9eff;
      }
      .tile-indicator.center {
        background: #7c3aed;
      }
      #game-container {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #game-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #game-hud {
        position: fixed;
        bottom: 20px;
        left: 60px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.6);
        padding: 16px;
        border-radius: 8px;
        pointer-events: none;
      }
      #game-hud.hidden {
        display: none;
      }
      #speed-display {
        font-size: 2rem;
        font-weight: 600;
      }
      #controls-hint {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.6);
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 12px;
        color: #888;
      }
      #controls-hint kbd {
        display: inline-block;
        padding: 2px 6px;
        background: #333;
        border-radius: 4px;
        margin: 0 2px;
      }
      #error-message {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(0, 0, 0, 0.9);
        z-index: 2000;
      }
      #error-message.visible {
        display: flex;
      }
      #error-message h2 {
        color: #ff4444;
      }
      #error-message button {
        padding: 12px 24px;
        background: #333;
        border: none;
        color: #eee;
        border-radius: 6px;
        cursor: pointer;
      }
      #error-message button:hover {
        background: #444;
      }
      /* Options panel - hidden by default, opened with F12 or gear icon */
      .options-toggle {
        position: fixed;
        bottom: 20px;
        left: 20px;
        width: 32px;
        height: 32px;
        background: rgba(0, 0, 0, 0.4);
        border: none;
        border-radius: 50%;
        color: #888;
        font-size: 18px;
        cursor: pointer;
        z-index: 100;
        opacity: 0.5;
        transition:
          opacity 0.2s,
          background 0.2s;
      }
      .options-toggle:hover {
        opacity: 1;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
      }
      .options-panel {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(420px, calc(100vw - 40px));
        max-height: calc(100vh - 40px);
        background: rgba(20, 20, 30, 0.95);
        border: 1px solid #444;
        border-radius: 12px;
        z-index: 1000;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
      }
      .options-panel.hidden {
        display: none;
      }
      .options-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid #333;
        background: rgba(0, 0, 0, 0.3);
      }
      .options-header h2 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 500;
        color: #eee;
      }
      .options-close {
        background: none;
        border: none;
        color: #888;
        font-size: 24px;
        cursor: pointer;
        padding: 0;
        line-height: 1;
      }
      .options-close:hover {
        color: #fff;
      }
      .options-content {
        padding: 16px 20px;
        overflow-y: auto;
        max-height: calc(100vh - 140px);
      }
      .options-section {
        margin-bottom: 20px;
      }
      .options-section:last-child {
        margin-bottom: 0;
      }
      .options-section h3 {
        margin: 0 0 12px;
        font-size: 0.9rem;
        font-weight: 600;
        color: #7c9ed9;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .option-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .option-row label {
        color: #bbb;
        font-size: 0.9rem;
      }
      .option-row select,
      .option-row input[type='text'] {
        background: #2a2a35;
        border: 1px solid #444;
        border-radius: 6px;
        color: #eee;
        padding: 6px 10px;
        font-size: 0.85rem;
        min-width: 140px;
      }
      .option-row input[type='text'] {
        min-width: 180px;
      }
      .option-row select:focus,
      .option-row input:focus {
        outline: none;
        border-color: #5a8ad9;
      }
      .option-info {
        color: #888;
        font-size: 0.8rem;
        margin: 8px 0;
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 6px;
      }
      .option-buttons {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .option-buttons button {
        flex: 1;
        padding: 8px 12px;
        background: #3a3a45;
        border: 1px solid #555;
        border-radius: 6px;
        color: #ddd;
        font-size: 0.8rem;
        cursor: pointer;
        transition: background 0.2s;
      }
      .option-buttons button:hover {
        background: #4a4a55;
      }
      .options-note {
        color: #777;
        font-size: 0.75rem;
        margin: 8px 0 0;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <h1>NABLA ENGINE</h1>
      <div id="loading-status">Initializing...</div>
      <div id="loading-progress">
        <div id="loading-progress-bar"></div>
      </div>
      <div id="loading-tiles">
        <div class="tile-indicator" data-tile="0"></div>
        <div class="tile-indicator" data-tile="1"></div>
        <div class="tile-indicator" data-tile="2"></div>
        <div class="tile-indicator" data-tile="3"></div>
        <div class="tile-indicator center" data-tile="4"></div>
        <div class="tile-indicator" data-tile="5"></div>
        <div class="tile-indicator" data-tile="6"></div>
        <div class="tile-indicator" data-tile="7"></div>
        <div class="tile-indicator" data-tile="8"></div>
      </div>
    </div>

    <div id="game-container">
      <canvas id="game-canvas"></canvas>
    </div>

    <div id="game-hud" class="hidden">
      <div id="speed-display">0 km/h</div>
      <div id="gear-display">N</div>
      <div id="location-display"></div>
    </div>

    <div id="controls-hint">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Drive · <kbd>Space</kbd> Brake ·
      <kbd>C</kbd> Camera · <kbd>R</kbd> Reset
    </div>

    <div id="error-message">
      <h2>Error</h2>
      <p id="error-text">Something went wrong</p>
      <button onclick="location.reload()">Reload</button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
