name: Prepare online-session branch
on:
  push:
    branches: [codex/online-sessions]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'txemavs/nabla-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/online-sessions
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Regenerate source references and format changed files
        run: |
          npx prettier --write src/runtime/online.ts src/runtime/online-presence.ts src/runtime/browser.ts game/ar.ts vite.game.config.ts package.json compose.dev.yaml docs/online-sessions.md test/runtime/online.test.ts .github/workflows/ci.yml docs/reference
          npm run docs:generate
          rm .github/workflows/prepare-online-branch.yml
      - name: Preserve generated changes on the implementation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src game vite.game.config.ts package.json compose.dev.yaml docs test .github/workflows
          git commit -m "Generate online API reference and normalize formatting"
          git push origin HEAD:codex/online-sessions
      - run: npm run check
      - run: node scripts/check-package.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/online/requirements.txt
      - run: python -m unittest discover -s services/online
