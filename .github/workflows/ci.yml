name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:prepare
      - name: Test cache and baked delivery
        run: CACHE_DIR="$RUNNER_TEMP/nabla-cache-tests" python3 -m unittest discover -s services/world-cache
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --reporter=list
      - name: Check distributable contents
        run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: ignore
