name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: docker compose -f compose.dev.yaml config --quiet
      - run: npm ci
      - name: Validate white truck assets and flat-ground trailer prototype
        run: |
          node assets/studio/trucks/white-truck-studio/tests/assets.mjs
          node assets/studio/trucks/white-truck-studio/tests/simulation.mjs
      - run: npm run check
      - name: Verify public API from an installed package
        run: node scripts/check-package.mjs
      - run: npm run build:prepare
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Test cache and baked delivery
        run: CACHE_DIR="$RUNNER_TEMP/nabla-cache-tests" python3 -m unittest discover -s services/world-cache
      - run: npx playwright install --with-deps chromium
      - name: Engine rendering tests (no Studio host)
        run: npm run test:e2e -- --reporter=list
      - name: Check distributable contents
        run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: ignore
